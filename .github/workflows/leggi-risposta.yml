name: Leggi la risposta della proprietaria

on:
  issue_comment:
    types: [created]

permissions:
  contents: write  # dal 16/10/2026: con «scarta» il post si toglie anche dalla cartella coda/
  issues: write

jobs:
  leggi:
    # Primo filtro qui, secondo filtro identico dentro il programma.
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registra la decisione
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dal 02/11/2026 il rifare automatico parte solo da qui (non più a ogni etichetta)
          RIFARE_ATTIVITA: trig_01W8kYX3ExZ6XP2qw6oLbH1z
          RIFARE_CHIAVE: ${{ secrets.RIFARE_CHIAVE }}
        run: python3 strumenti/leggi_risposta.py
